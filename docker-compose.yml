services:
  postgres:
    image: postgres:17-alpine
    container_name: academiax-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academiax_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-academiax_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: academiax-eureka
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: academiax-auth
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-academiax_db}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-root}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-AcademiaXSecretKeyForJWTAuthentication2026}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: academiax-user
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-academiax_db}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-root}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-AcademiaXSecretKeyForJWTAuthentication2026}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: academiax-course
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-academiax_db}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-root}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-AcademiaXSecretKeyForJWTAuthentication2026}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: academiax-payment
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-academiax_db}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-root}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-AcademiaXSecretKeyForJWTAuthentication2026}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    container_name: academiax-enrollment
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-academiax_db}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-root}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-AcademiaXSecretKeyForJWTAuthentication2026}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: academiax-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-AcademiaXSecretKeyForJWTAuthentication2026}
    depends_on:
      eureka-server:
        condition: service_healthy

volumes:
  postgres_data:
